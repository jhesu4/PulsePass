$kind: http-request
name: "TC-BIZ-014 · Aforo: B intenta comprar sin cupo (TC-BIZ-014; TKT-15)"
description: "**ID:** TC-BIZ-014

  **ID heredado:** TKT-15\r

  **Rol / token:** USER (B)

  **Resultado esperado:** HTTP 409

  **Precondiciones:** Configurar: AUTH-11 → userBToken, baseUrl, AUTH-02 → userBEmail, fullEventCode. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"timestamp\":\"<ISO-8601>\",\"status\":409,\"error\":\"<HTTP reason>\",\"message\":\"<mensaje del error>\",\"details\":{}}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Confirmar HTTP 409 y que JSON.status=409; revisar message/details para el motivo esperado y que el error no exponga credenciales."
url: "{{baseUrl}}/api/tickets"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "userEmail": "{{userBEmail}}",
      "eventCode": "{{fullEventCode}}",
      "type": "GENERAL"
    }
auth:
  type: bearer
  credentials:
    token: "{{userBToken}}"
order: 16000
