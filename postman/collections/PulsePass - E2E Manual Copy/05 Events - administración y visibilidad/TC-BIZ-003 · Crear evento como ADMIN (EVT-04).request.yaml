$kind: http-request
description: "**Flujo PRD:** C — Gestión del catálogo, paso 2.

  **ID:** TC-BIZ-003

  **ID heredado:** EVT-04\r

  **Rol / token:** ADMIN

  **Resultado esperado:** HTTP 201

  **Precondiciones:** Configurar: AUTH-13 → adminToken, baseUrl, runId, futureDate, venueCode. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"id\":0,\"eventCode\":\"{{runId}}-EVT-1\",\"name\":\"<nombre>\",\"description\":\"<descripción>\",\"category\":\"MUSIC\",\"status\":\"DRAFT\",\"eventDate\":\"<ISO-8601>\",\"minimumAge\":0,\"venueCode\":\"{{venueActiveCode}}\",\"venueName\":\"<nombre de sede>\",\"artists\":[]}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Respuesta 201 con eventCode={{runId}}-EVT-1 y status=DRAFT; confirmar el código para consultas posteriores.

  **Notas de ejecución:** El evento queda en DRAFT."
url: "{{baseUrl}}/api/events"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "eventCode": "{{runId}}-EVT-1",
      "name": "E2E Evento creado",
      "description": "Creado en E2E",
      "category": "MUSIC",
      "eventDate": "{{futureDate}}",
      "minimumAge": 0,
      "venueCode": "{{venueActiveCode}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 5000
