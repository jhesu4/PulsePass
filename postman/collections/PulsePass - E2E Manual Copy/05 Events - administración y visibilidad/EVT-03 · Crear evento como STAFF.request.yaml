$kind: http-request
description: "**ID:** EVT-03

  **Rol / token:** STAFF

  **Resultado esperado:** HTTP 403

  **Precondiciones:** Configurar: AUTH-12 → staffToken, baseUrl, runId, futureDate, venueCode. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"timestamp\":\"<ISO-8601>\",\"status\":403,\"error\":\"<HTTP reason>\",\"message\":\"<mensaje del error>\",\"details\":{}}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Confirmar HTTP 403 y que JSON.status=403; revisar message/details para el motivo esperado y que el error no exponga credenciales."
url: "{{baseUrl}}/api/events"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "eventCode": "{{runId}}-EVT-1",
      "name": "E2E",
      "category": "MUSIC",
      "eventDate": "{{futureDate}}",
      "minimumAge": 0,
      "venueCode": "{{venueActiveCode}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
order: 4000
