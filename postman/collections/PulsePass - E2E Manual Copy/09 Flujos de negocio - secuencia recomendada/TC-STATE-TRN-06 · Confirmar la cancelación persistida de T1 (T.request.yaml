$kind: http-request
name: TC-STATE-TRN-06 · Confirmar la cancelación persistida de T1 (TC-BIZ-010)
description: "**Flujo PRD:** D — Cancelación; lectura posterior a transición exitosa\r

  **ID:** TC-STATE-TRN-06

  **Rol / token:** USER (A)

  **Resultado esperado:** HTTP 200

  **Precondiciones:** Configurar: AUTH-09 → userAToken, baseUrl, TKT-04 → ticketT1. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"id\":0,\"ticketCode\":\"{{ticketCancelableCode}}\",\"type\":\"GENERAL\",\"price\":0.00,\"status\":\"CANCELLED\",\"purchaseDate\":\"<ISO-8601>\",\"userEmail\":\"{{userAEmail}}\",\"eventCode\":\"{{publishedEventCode}}\",\"eventName\":\"<nombre>\"}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** ticketCode={{ticketCancelableCode}} presenta status=CANCELLED persistido."
url: "{{baseUrl}}/api/tickets/{{ticketCancelableCode}}"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 8000
