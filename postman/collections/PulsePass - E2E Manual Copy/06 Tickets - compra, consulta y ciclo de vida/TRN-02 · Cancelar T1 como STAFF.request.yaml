$kind: http-request
description: "**ID:** TRN-02

  **Rol / token:** STAFF

  **Resultado esperado:** HTTP 403

  **Precondiciones:** Configurar: AUTH-12 → staffToken, baseUrl, TKT-04 → ticketT1. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"timestamp\":\"<ISO-8601>\",\"status\":403,\"error\":\"<HTTP reason>\",\"message\":\"<mensaje del error>\",\"details\":{}}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Confirmar HTTP 403 y que JSON.status=403; revisar message/details para el motivo esperado y que el error no exponga credenciales.

  **Notas de ejecución:** STAFF no está autorizado por URL (solo USER/ADMIN)."
url: "{{baseUrl}}/api/tickets/{{ticketCancelableCode}}/cancel"
method: PATCH
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
order: 20000
