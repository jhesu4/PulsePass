$kind: http-request
description: "**ID:** TKT-07

  **Rol / token:** USER (A)

  **Resultado esperado:** HTTP 403

  **Precondiciones:** Configurar: AUTH-09 → userAToken, baseUrl, runId, publishedEventCode. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"timestamp\":\"<ISO-8601>\",\"status\":403,\"error\":\"<HTTP reason>\",\"message\":\"<mensaje del error>\",\"details\":{}}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Confirmar HTTP 403 y que JSON.status=403; revisar message/details para el motivo esperado y que el error no exponga credenciales.

  **Notas de ejecución:** Anti-enumeración: igual que TKT-06."
url: "{{baseUrl}}/api/tickets"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "userEmail": "{{runId}}-nadie@example.test",
      "eventCode": "{{publishedEventCode}}",
      "type": "GENERAL"
    }
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 6000
