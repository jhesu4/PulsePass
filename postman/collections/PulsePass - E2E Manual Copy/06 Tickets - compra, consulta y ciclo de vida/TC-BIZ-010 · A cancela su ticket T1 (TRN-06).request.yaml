$kind: http-request
description: "**ID:** TC-BIZ-010

  **ID heredado:** TRN-06\r

  **Rol / token:** USER (A)

  **Resultado esperado:** HTTP 200

  **Precondiciones:** Configurar: AUTH-09 → userAToken, baseUrl, TKT-04 → ticketT1. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"id\":0,\"ticketCode\":\"{{ticketCancelableCode}}\",\"type\":\"GENERAL\",\"price\":0.00,\"status\":\"PAID\",\"purchaseDate\":\"<ISO-8601>\",\"userEmail\":\"{{userAEmail}}\",\"eventCode\":\"{{publishedEventCode}}\",\"eventName\":\"<nombre>\"}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Respuesta 200 con status=CANCELLED; ejecutar TC-STATE-TRN-06 y confirmar la lectura persistida.

  **Notas de ejecución:** PAID→CANCELLED. Irreversible."
url: "{{baseUrl}}/api/tickets/{{ticketCancelableCode}}/cancel"
method: PATCH
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 24000
