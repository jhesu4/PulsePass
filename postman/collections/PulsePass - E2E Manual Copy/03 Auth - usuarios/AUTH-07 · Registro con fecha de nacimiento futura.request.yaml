$kind: http-request
description: "**ID:** AUTH-07

  **Rol / token:** Anónimo

  **Resultado esperado:** HTTP 409

  **Precondiciones:** Configurar: baseUrl, AUTH-08 → userCUsername, AUTH-08 → userCEmail, userCPassword. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"timestamp\":\"<ISO-8601>\",\"status\":409,\"error\":\"<HTTP reason>\",\"message\":\"<mensaje del error>\",\"details\":{}}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Confirmar HTTP 409 y que JSON.status=409; revisar message/details para el motivo esperado y que el error no exponga credenciales."
url: "{{baseUrl}}/api/users"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "username": "{{userCUsername}}",
      "email": "{{userCEmail}}",
      "firstName": "E2E",
      "lastName": "Tester",
      "phone": "3000000000",
      "city": "Bogota",
      "birthDate": "2999-01-01",
      "password": "{{userCPassword}}"
    }
auth:
  type: noauth
order: 21000
