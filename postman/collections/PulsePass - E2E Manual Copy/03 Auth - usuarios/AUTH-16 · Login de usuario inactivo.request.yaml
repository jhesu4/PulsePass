$kind: http-request
description: "**ID:** AUTH-16

  **Rol / token:** Público

  **Resultado esperado:** HTTP 401

  **Precondiciones:** Configurar: baseUrl, inactivePassword. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"timestamp\":\"<ISO-8601>\",\"status\":401,\"error\":\"<HTTP reason>\",\"message\":\"<mensaje del error>\",\"details\":{}}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Confirmar HTTP 401 y que JSON.status=401; revisar message/details para el motivo esperado y que el error no exponga credenciales.

  **Notas de ejecución:** No debe emitirse token."
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "identifier": "e2e-inactive",
      "password": "{{inactivePassword}}"
    }
auth:
  type: noauth
order: 8000
