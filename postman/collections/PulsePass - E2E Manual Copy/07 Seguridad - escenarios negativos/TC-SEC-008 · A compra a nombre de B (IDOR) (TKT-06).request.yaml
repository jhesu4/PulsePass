$kind: http-request
description: "**ID:** TC-SEC-008

  **ID heredado:** TKT-06\r

  **Rol / token:** USER (A)

  **Resultado esperado:** HTTP 403

  **Precondiciones:** Configurar: AUTH-09 → userAToken, baseUrl, AUTH-02 → userBEmail, publishedEventCode. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"timestamp\":\"<ISO-8601>\",\"status\":403,\"error\":\"<HTTP reason>\",\"message\":\"<mensaje del error>\",\"details\":{}}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** ErrorResponse con status=403; ejecutar TC-STATE-TKT-06 inmediatamente y confirmar lista vacía para B."
url: "{{baseUrl}}/api/tickets"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "userEmail": "{{userBEmail}}",
      "eventCode": "{{publishedEventCode}}",
      "type": "GENERAL"
    }
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 14000
