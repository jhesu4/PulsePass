spring:

  application:
    name: pulsepass

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulsepass}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:

    open-in-view: false

    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  forward-headers-strategy: framework

pulsepass:
  security:
    cors:
      allowed-origins: ${PULSEPASS_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    jwt:
      issuer: ${PULSEPASS_JWT_ISSUER:pulsepass-api}
      secret-base64: ${PULSEPASS_JWT_SECRET_BASE64:}
      access-token-ttl: ${PULSEPASS_JWT_ACCESS_TOKEN_TTL:PT15M}