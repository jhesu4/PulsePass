$kind: http-request
description: "**ID:** TC-SEC-001

  **ID heredado:** EVT-01\r

  **Rol / token:** Anónimo

  **Resultado esperado:** HTTP 401

  **Precondiciones:** Configurar: baseUrl, runId, futureDate, venueCode. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"timestamp\":\"<ISO-8601>\",\"status\":401,\"error\":\"<HTTP reason>\",\"message\":\"<mensaje del error>\",\"details\":{}}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Confirmar HTTP 401 y que JSON.status=401; revisar message/details para el motivo esperado y que el error no exponga credenciales."
url: "{{baseUrl}}/api/events"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "eventCode": "{{runId}}-EVT-1",
      "name": "E2E",
      "category": "MUSIC",
      "eventDate": "{{futureDate}}",
      "minimumAge": 0,
      "venueCode": "{{venueActiveCode}}"
    }
auth:
  type: noauth
order: 5000
