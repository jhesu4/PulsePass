$kind: http-request
name: TC-AUTH-014 · Token válido sobre endpoint protegido de otro rol (JWT-08)
description: "**ID:** TC-AUTH-014

  **ID heredado:** JWT-08\r

  **Rol / token:** USER (A)

  **Resultado esperado:** HTTP 403

  **Precondiciones:** Configurar: AUTH-09 → userAToken, baseUrl, publishedEventCode. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"timestamp\":\"<ISO-8601>\",\"status\":403,\"error\":\"<HTTP reason>\",\"message\":\"<mensaje del error>\",\"details\":{}}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Confirmar HTTP 403 y que JSON.status=403; revisar message/details para el motivo esperado y que el error no exponga credenciales."
url: "{{baseUrl}}/api/events/{{publishedEventCode}}/tickets/paid"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 27000
