  **Rol / token:** USER (A)

  **Resultado esperado:** HTTP 403

  **Precondiciones:** Configurar: AUTH-09 → userAToken, baseUrl, AUTH-02 → userBEmail. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"timestamp\":\"<ISO-8601>\",\"status\":403,\"error\":\"<HTTP reason>\",\"message\":\"<mensaje del error>\",\"details\":{}}\r

