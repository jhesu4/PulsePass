  **Rol / token:** USER (B)

  **Resultado esperado:** HTTP 403

  **Precondiciones:** Configurar: AUTH-11 → userBToken, baseUrl, TKT-04 → ticketT1. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"timestamp\":\"<ISO-8601>\",\"status\":403,\"error\":\"<HTTP reason>\",\"message\":\"<mensaje del error>\",\"details\":{}}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

