$kind: http-request
description: "**ID:** TC-SEC-011

  **ID heredado:** TRN-01\r

  **Rol / token:** USER (B)

  **Resultado esperado:** HTTP 403

  **Precondiciones:** Configurar: AUTH-11 → userBToken, baseUrl, TKT-04 → ticketT1. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"timestamp\":\"<ISO-8601>\",\"status\":403,\"error\":\"<HTTP reason>\",\"message\":\"<mensaje del error>\",\"details\":{}}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** ErrorResponse con status=403; ejecutar TC-STATE-TRN-01 inmediatamente y confirmar que T1 sigue PAID."
url: "{{baseUrl}}/api/tickets/{{ticketCancelableCode}}/cancel"
method: PATCH
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{userBToken}}"
order: 17000
