$kind: http-request
description: "**ID:** EVT-27

  **Rol / token:** ADMIN

  **Resultado esperado:** HTTP 404

  **Precondiciones:** Configurar: AUTH-13 → adminToken, baseUrl, runId, missingArtistId. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"timestamp\":\"<ISO-8601>\",\"status\":404,\"error\":\"<HTTP reason>\",\"message\":\"<mensaje del error>\",\"details\":{}}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Confirmar HTTP 404 y que JSON.status=404; revisar message/details para el motivo esperado y que el error no exponga credenciales."
url: "{{baseUrl}}/api/events/{{runId}}-EVT-1/artists/{{missingArtistId}}"
method: POST
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 15000
