$kind: http-request
description: |-
  **ID:** EVT-31
  **Rol / token:** STAFF
  **Resultado esperado:** HTTP 200
  **Precondiciones:** Ejecutar después de EVT-30. Configurar staffToken, artistStageName, draftEventCode, runId y venueCode.
  **JSON esperado:**
  ```json
  [{"id":0,"eventCode":"{{runId}}-EVT-1","name":"<nombre>","category":"MUSIC","status":"PUBLISHED","eventDate":"<ISO-8601>","venueCode":"{{venueActiveCode}}","venueName":"<nombre de sede>"},{"id":0,"eventCode":"{{draftEventCode}}","name":"E2E Borrador (artistas)","category":"MUSIC","status":"DRAFT","eventDate":"<ISO-8601>","venueCode":"{{venueActiveCode}}","venueName":"<nombre de sede>"}]
  ```
  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.
  **Comprobaciones específicas:** La lista debe incluir `{{draftEventCode}}` con `status=DRAFT`; como STAFF puede ver eventos DRAFT asociados al artista. El orden de los resultados no está garantizado.
url: "{{baseUrl}}/api/events/by-artist?stageName={{artistStageName}}"
method: GET
headers:
  Accept: application/json
queryParams:
  stageName: "{{artistStageName}}"
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
order: 18000
