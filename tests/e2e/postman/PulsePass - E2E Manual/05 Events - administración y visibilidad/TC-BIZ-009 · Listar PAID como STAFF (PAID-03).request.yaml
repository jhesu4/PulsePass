$kind: http-request
description: "**ID:** TC-BIZ-009

  **ID heredado:** PAID-03\r

  **Rol / token:** STAFF

  **Resultado esperado:** HTTP 200

  **Precondiciones:** Configurar: AUTH-12 → staffToken, baseUrl, publishedEventCode. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  [{\"id\":0,\"ticketCode\":\"<ticketCode>\",\"type\":\"GENERAL\",\"price\":0.00,\"status\":\"PAID\",\"purchaseDate\":\"<ISO-8601>\",\"userEmail\":\"<correo del titular>\",\"eventCode\":\"{{publishedEventCode}}\",\"eventName\":\"<nombre>\"}]\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Confirmar eventCode, status, venueCode y datos esperados para el caso.

  **Notas de ejecución:** Tras folder 06: T1 (CANCELLED) y T2 (USED) NO deben aparecer."
url: "{{baseUrl}}/api/events/{{publishedEventCode}}/tickets/paid"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
