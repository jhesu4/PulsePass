$kind: http-request
description: "**ID:** TKT-20

  **Rol / token:** ADMIN + X-Admin-Purpose

  **Resultado esperado:** HTTP 200

  **Precondiciones:** Configurar: AUTH-13 → adminToken, baseUrl, TKT-04 → ticketT1. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"id\":0,\"ticketCode\":\"{{ticketCancelableCode}}\",\"type\":\"GENERAL\",\"price\":0.00,\"status\":\"PAID\",\"purchaseDate\":\"<ISO-8601>\",\"userEmail\":\"{{userAEmail}}\",\"eventCode\":\"{{publishedEventCode}}\",\"eventName\":\"<nombre>\"}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Confirmar ticketCode, estado y titular esperados; no exponer datos ajenos."
url: "{{baseUrl}}/api/tickets/{{ticketCancelableCode}}"
method: GET
headers:
  X-Admin-Purpose: TICKET_SUPPORT
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 10000
