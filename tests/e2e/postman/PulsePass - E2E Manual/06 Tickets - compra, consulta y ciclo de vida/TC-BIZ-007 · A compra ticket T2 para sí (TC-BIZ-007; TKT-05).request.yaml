$kind: http-request
description: "**ID:** TC-BIZ-007

  **ID heredado:** TKT-05\r

  **Rol / token:** USER (A)

  **Resultado esperado:** HTTP 201

  **Precondiciones:** Configurar: AUTH-09 → userAToken, baseUrl, AUTH-01 → userAEmail, publishedEventCode. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"id\":0,\"ticketCode\":\"{{ticketUsableCode}}\",\"type\":\"VIP\",\"price\":0.00,\"status\":\"PAID\",\"purchaseDate\":\"<ISO-8601>\",\"userEmail\":\"{{userAEmail}}\",\"eventCode\":\"{{publishedEventCode}}\",\"eventName\":\"<nombre>\"}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Respuesta 201 con ticketCode y status=PAID; guardar ticketCode en ticketT2.

  **Notas de ejecución:** Copiar `ticketCode` a `ticketT2` (se usará para la transición USE, separado de T1 que se cancela)."
url: "{{baseUrl}}/api/tickets"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "userEmail": "{{userAEmail}}",
      "eventCode": "{{publishedEventCode}}",
      "type": "VIP"
    }
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 5000
