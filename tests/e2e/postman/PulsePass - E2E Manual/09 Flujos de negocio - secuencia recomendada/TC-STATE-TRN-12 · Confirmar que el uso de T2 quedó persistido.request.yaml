$kind: http-request
name: TC-STATE-TRN-12 · Confirmar que el uso de T2 quedó persistido (TC-BIZ-012)
description: "**Flujo PRD:** D — Uso por STAFF; lectura posterior a transición exitosa\r

  **ID:** TC-STATE-TRN-12

  **Rol / token:** USER (A)

  **Resultado esperado:** HTTP 200

  **Precondiciones:** Configurar: AUTH-09 → userAToken, baseUrl, TKT-05 → ticketT2. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"id\":0,\"ticketCode\":\"{{ticketUsableCode}}\",\"type\":\"GENERAL\",\"price\":0.00,\"status\":\"USED\",\"purchaseDate\":\"<ISO-8601>\",\"userEmail\":\"{{userAEmail}}\",\"eventCode\":\"{{publishedEventCode}}\",\"eventName\":\"<nombre>\"}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** ticketCode={{ticketUsableCode}} presenta status=USED persistido."
url: "{{baseUrl}}/api/tickets/{{ticketUsableCode}}"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 9000
