  **Resultado esperado:** HTTP 200

  **Precondiciones:** Ejecutar inmediatamente después de TC-SEC-012.

  **JSON esperado:**

  ```json

  {\"id\":0,\"ticketCode\":\"{{ticketCancelableCode}}\",\"type\":\"GENERAL\",\"price\":0.00,\"status\":\"PAID\",\"purchaseDate\":\"<ISO-8601>\",\"userEmail\":\"{{userAEmail}}\",\"eventCode\":\"{{publishedEventCode}}\",\"eventName\":\"<nombre>\"}

  ```

  **Comprobaciones específicas:** Confirmar que la denegación a USER_B no cambió propietario ni estado; `status` sigue `PAID`.

  **Flujo PRD:** D — Compra, propiedad, cancelación y uso; lectura posterior a la denegación."
