$kind: http-request
description: "**Flujo PRD:** C — Gestión del catálogo; paso 6: verificar listado por artista\r

  **ID:** TC-BIZ-005

  **Rol / token:** Anónimo

  **Resultado esperado:** HTTP 200

  **Precondiciones:** Configurar: baseUrl, PUB-04 → artistStageName. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  [{\"id\":0,\"eventCode\":\"{{runId}}-EVT-1\",\"name\":\"<nombre>\",\"category\":\"MUSIC\",\"status\":\"PUBLISHED\",\"eventDate\":\"<ISO-8601>\",\"venueCode\":\"{{venueActiveCode}}\",\"venueName\":\"<nombre de sede>\"}]\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** La lista por artistStageName incluye {{runId}}-EVT-1 con status=PUBLISHED."
url: "{{baseUrl}}/api/events/by-artist?stageName={{artistStageName}}"
method: GET
headers:
  Accept: application/json
queryParams:
  stageName: "{{artistStageName}}"
auth:
  type: noauth
order: 4000
