$kind: http-request
name: TC-BIZ-014 · Comprar evento con edad mínima no cumplida (TC-BIZ-014; TKT-12)
description: "**ID:** TC-BIZ-014

  **ID heredado:** TKT-12\r

  **Rol / token:** USER (A)

  **Resultado esperado:** HTTP 409

  **Precondiciones:** Configurar: AUTH-09 → userAToken, baseUrl, AUTH-01 → userAEmail, ageEventCode. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"timestamp\":\"<ISO-8601>\",\"status\":409,\"error\":\"<HTTP reason>\",\"message\":\"<mensaje del error>\",\"details\":{}}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Confirmar HTTP 409 y que JSON.status=409; revisar message/details para el motivo esperado y que el error no exponga credenciales."
url: "{{baseUrl}}/api/tickets"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "userEmail": "{{userAEmail}}",
      "eventCode": "{{ageEventCode}}",
      "type": "GENERAL"
    }
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 15000
