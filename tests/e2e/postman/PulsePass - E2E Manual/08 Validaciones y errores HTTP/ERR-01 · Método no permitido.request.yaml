$kind: http-request
description: "**ID:** ERR-01

  **Rol / token:** ADMIN

  **Resultado esperado:** HTTP 405

  **Precondiciones:** Configurar: AUTH-13 → adminToken, baseUrl, publishedEventCode. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"timestamp\":\"<ISO-8601>\",\"status\":405,\"error\":\"<HTTP reason>\",\"message\":\"<mensaje del error>\",\"details\":{}}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Confirmar HTTP 405 y que JSON.status=405; revisar message/details para el motivo esperado y que el error no exponga credenciales."
url: "{{baseUrl}}/api/events/{{publishedEventCode}}"
method: DELETE
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 20000
