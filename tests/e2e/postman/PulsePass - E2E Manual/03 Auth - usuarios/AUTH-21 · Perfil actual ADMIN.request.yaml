$kind: http-request
description: "**ID:** AUTH-21

  **Rol / token:** ADMIN

  **Resultado esperado:** HTTP 200

  **Precondiciones:** Configurar: AUTH-13 → adminToken, baseUrl. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"userId\":0,\"username\":\"<username autenticado>\",\"roles\":[\"ADMIN\"]}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Confirmar id, username y roles actuales de la identidad autenticada."
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 14000
