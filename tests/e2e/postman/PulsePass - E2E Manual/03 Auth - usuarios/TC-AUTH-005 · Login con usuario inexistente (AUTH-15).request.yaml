$kind: http-request
description: "**ID:** TC-AUTH-005

  **ID heredado:** AUTH-15\r

  **Rol / token:** Público

  **Resultado esperado:** HTTP 401

  **Precondiciones:** Configurar: baseUrl, runId. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"timestamp\":\"<ISO-8601>\",\"status\":401,\"error\":\"<HTTP reason>\",\"message\":\"<mensaje del error>\",\"details\":{}}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Confirmar HTTP 401 y que JSON.status=401; revisar message/details para el motivo esperado y que el error no exponga credenciales.

  **Notas de ejecución:** Anti-enumeración: mismo código y mensaje que AUTH-14."
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "identifier": "{{runId}}-nadie",
      "password": "Incorrecta-123456"
    }
auth:
  type: noauth
order: 7000
