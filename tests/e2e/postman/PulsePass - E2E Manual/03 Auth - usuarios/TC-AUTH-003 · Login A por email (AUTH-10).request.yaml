$kind: http-request
description: "**ID:** TC-AUTH-003

  **ID heredado:** AUTH-10\r

  **Rol / token:** Público

  **Resultado esperado:** HTTP 200

  **Precondiciones:** Configurar: baseUrl, AUTH-01 → userAEmail, userAPassword. Usar la base E2E y un runId único.

  **JSON esperado:**\r

  ```json\r

  {\"accessToken\":\"<JWT; no guardar>\",\"tokenType\":\"Bearer\",\"expiresIn\":900}\r

  ```\r

  Los IDs `0` y textos entre `<...>` son marcadores de forma; comparar los valores concretos y campos indicados abajo.

  **Comprobaciones específicas:** Verificar tokenType=Bearer y expiresIn={{expectedTokenTtlSeconds}}; decodificar payload sin registrar el JWT y revisar sub, iss={{expectedIssuer}}, iat, exp (TTL exacto) y jti UUID único."
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "identifier": "{{userAEmail}}",
      "password": "{{userAPassword}}"
    }
auth:
  type: noauth
order: 2000
